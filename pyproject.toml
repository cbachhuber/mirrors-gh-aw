[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
test = ["pytest>=7"]

[project]
name = "gh-aw-mirror"
dynamic = ["version"]
description = "pre-commit mirror for the gh-aw agentic-workflow compiler"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Chris Bachhuber"}]
keywords = ["pre-commit", "gh-aw", "github-actions", "agentic-workflows"]

[project.scripts]
gh-aw = "gh_aw_mirror:main"

[project.urls]
"Upstream" = "https://github.com/github/gh-aw"

[tool.rumdl.MD013]
# Enforce one sentence per line, without a column limit.
require-sentence-per-line = true
reflow = true
line-length = 10000
code-blocks = false
tables = false

[tool.setuptools]
packages = ["gh_aw_mirror"]

[tool.setuptools.dynamic]
version = {attr = "gh_aw_mirror.__version__"}

[tool.setuptools.package-data]
gh_aw_mirror = ["checksums.txt"]

[tool.uv]
# Make the test group resolvable by ty (and plain `uv run`) without --group.
default-groups = ["test"]
