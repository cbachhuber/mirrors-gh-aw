[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-aw-mirror"
dynamic = ["version"]
description = "pre-commit mirror for the gh-aw agentic-workflow compiler"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Chris Bachhuber" }]
keywords = ["pre-commit", "gh-aw", "github-actions", "agentic-workflows"]

[project.urls]
"Upstream" = "https://github.com/github/gh-aw"

[project.scripts]
gh-aw = "gh_aw_mirror:main"

[tool.setuptools]
packages = ["gh_aw_mirror"]

[tool.setuptools.dynamic]
version = { attr = "gh_aw_mirror.__version__" }

[tool.setuptools.package-data]
gh_aw_mirror = ["checksums.txt"]
